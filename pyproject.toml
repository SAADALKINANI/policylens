[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "policylens"
version = "0.1.0"
description = "Search, summarize and connect government policy documents: hybrid BM25 + LSA search, TextRank summaries, citation graphs, acronym glossaries"
readme = "README.md"
license = { text = "Apache-2.0" }
requires-python = ">=3.10"
dependencies = ["numpy>=1.24", "scikit-learn>=1.3", "networkx>=3.0"]

[project.optional-dependencies]
pdf = ["pypdf>=4"]
dev = ["pytest>=7"]

[project.scripts]
policylens = "policylens.cli:main"

[tool.setuptools]
packages = ["policylens"]
